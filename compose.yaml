# Levanta el servicio de catálogo con su propia base de datos.
# El Compose del sistema completo vive en turnos-service e incluye a este.

services:
  catalogo-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${CATALOGO_DB_PORT}:5432"
    volumes:
      - catalogo-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalogo-service:
    build: .
    environment:
      DB_URL: jdbc:postgresql://catalogo-db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt-public.pem
    volumes:
      # Archivos secretos, fuera de Git. Se montan en solo lectura.
      - ./secrets:/run/secrets:ro
    ports:
      - "${CATALOGO_PORT}:8080"
    depends_on:
      catalogo-db:
        condition: service_healthy

volumes:
  catalogo-db-data:
